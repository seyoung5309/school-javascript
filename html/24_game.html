<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=S, initial-scale=1.0" />
    <title>가위바위보</title>
    <style>
      button {
        width: 80px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <h2>컴퓨터와 가위바위보하기</h2>
    <h3>무엇을 낼까?</h3>
    <div id="input">
      <button onclick="userInput(0)">가위</button>
      <button onclick="userInput(1)">바위</button>
      <button onclick="userInput(2)">보</button>
    </div>
    <h2 id="result">결과</h2>
    <div id="answer">
      <h3 id="answer1">나 : 대기중</h3>
      <h3 id="answer2">컴퓨터 대기중</h3>
    </div>
    <p id="re"></p>
    <script src="../js/common.js"></script>
    <script>
      let input = 0;
      let computer = 0;

      let htmlOutput = (answer) => {
        let me = input == 0 ? "가위" : input == 1 ? "바위" : "보";
        let you = computer == 0 ? "가위" : computer == 1 ? "바위" : "보";
        let output1 = `나 : ${me}`;
        let output2 = `컴퓨터 : ${you}`;
        console.log(input, computer);
        document.getElementById("answer1").innerText = output1;
        document.getElementById("answer2").innerText = output2;

        let result = 0;
        if (answer >= 1) {
          result = "승리";
        } else if (answer <= -1) {
          result = "패배";
        } else {
          result = "무승부";
        }
        document.getElementById("result").innerText = `결과 : ${result}`;

        // console.log(document.getElementById("re"));
        // document.getElementById("re") = `<button>다시하기</button>`;
      };

      let userInput = (num) => {
        console.log(`사용자의 답변 : ${num}`);

        if (input) {
          return;
        }

        input = num;
        computer = getRandomInteger(0, 2);
        let answer = 0;

        switch (input) {
          case 0:
            if (computer == 1) {
              answer = -1;
            } else if (computer == 2) {
              answer = 1;
            } else {
              answer = 0;
            }
            break;
          case 1:
            if (computer == 2) {
              answer = -1;
            } else if (computer == 0) {
              answer = 1;
            } else {
              answer = 0;
            }
            break;
          case 2:
            if (computer == 0) {
              answer = -1;
            } else if (computer == 1) {
              answer = 1;
            } else {
              answer = 0;
            }
        }
        htmlOutput(answer);
      };
    </script>
  </body>
</html>
