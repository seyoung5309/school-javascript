<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=S, initial-scale=1.0" />
    <title>가위바위보</title>
    <style>
      button {
        width: 80px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <h2>컴퓨터와 가위바위보하기</h2>
    <h3>무엇을 낼까?</h3>
    <div id="input">
      <button onclick="userInput(0)">가위</button>
      <button onclick="userInput(1)">바위</button>
      <button onclick="userInput(2)">보</button>
    </div>
    <h2 id="result">결과</h2>
    <div id="answer">
      <h3 id="answer1">나 : 대기중</h3>
      <h3 id="answer2">컴퓨터 대기중</h3>
    </div>
    <button id="re" onclick="reGame()">진행중</button>

    <script src="../js/common.js"></script>
    <script>
      let input = 0;
      let computer = 0;

      let htmlOutput = (answer) => {
        let me = input == 0 ? "가위" : input == 1 ? "바위" : "보";
        let you = computer == 0 ? "가위" : computer == 1 ? "바위" : "보";
        document.getElementById("answer1").innerText = `나 : ${me}`;
        document.getElementById("answer2").innerText = `컴퓨터 : ${you}`;

        let result = 0;
        if (answer >= 1) {
          result = "승리";
        } else if (answer <= -1) {
          result = "패배";
        } else {
          result = "무승부";
        }

        document.getElementById("result").innerText = `결과 : ${result}`;

        console.log(document.getElementById("re"));
        document.getElementById("re").innerText = `다시하기`;
      };

      let userInput = (num) => {
        // 사용자와 컴퓨터의 가위바위보 승부 결과
        if (input) return;

        input = num;
        computer = getRandomInteger(0, 2);
        let answer = 0;

        switch (input) {
          case 0: // 사용자 : 가위
            if (computer == 1) {
              answer = -1;
            } else if (computer == 2) {
              answer = 1;
            } else {
              answer = 0;
            }
            break;
          case 1: // 사용자 : 바위
            if (computer == 2) {
              answer = -1;
            } else if (computer == 0) {
              answer = 1;
            } else {
              answer = 0;
            }
            break;
          case 2: // 사용자 : 보
            if (computer == 0) {
              answer = -1;
            } else if (computer == 1) {
              answer = 1;
            } else {
              answer = 0;
            }
        }

        htmlOutput(answer);
      };

      // 다시하기
      let reGame = () => {
        input = 0;
        document.getElementById("re").innerText = `진행중`;
        document.getElementById("result").innerText = `결과`;
        document.getElementById("answer1").innerText = "나 : 대기중";
        document.getElementById("answer2").innerText = "컴퓨터 : 대기중";
      };
    </script>
  </body>
</html>
