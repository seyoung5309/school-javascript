<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="myFunction2(this)">클릭</button>
    <select>
      <select onclick="myFunction2(this)">
        <option value="A" ,>A</option>
        <option value="B" ,>B</option>
        <option value="c" ,>C</option>
      </select>
    </select>
    <script>
      console.log(this);
      <!-- 버튼 (DOM객체)-->

      function myFunction() {
        console.log(this);
      }

      myFunction();

      // 2. (OO객체)를 의미하는
      function myFunction2(p) {
        console.log(p);
      }

      // 3. this = object
      let firstName = "Pitt";
      let lastName = "brad";

      let person = {
        firstName: "Doe",
        lastName: "John",
        getFullName: function () {
          return this.firstName + this.lastName;
        },
      };

      console.log(person.getFullName());
    </script>
  </body>
</html>
