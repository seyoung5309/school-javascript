<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <button id="get_btn">조회</button>
      <button id="post_btn">생성</button>
      <button id="put_btn">수정</button>
      <button id="del_btn">삭제</button>
    </div>
    <script>
      /*
            3. Fetch API (ECMA6 버전부터 지원)
            - 바닐라 자바스크립트에서 일반적으로 서버와의 통신에 사용하는 API
            - 자체 Promise 객체를 갖으며, XMLHttpRequest 객체나 Promise(then, resolve(), reject())의 복잡한 사용 단계를 간소화하여 사용이 간단하다.
            - response.json()을 이용하면 parse를 이용하지 않아도 json 문자열을 가져와 자바스크립트 객체로 변환한다.
            - 그러나 json 문자열 생성 시는 **JSON.stringify(data)**는 그대로 사용한다.
            - 형식 : 조회 시는 객체를 생략한다.

            ```
            fetch(url, 생성, 수정, 삭제 시 옵션 객체).then(response => response.json()).then(json=> console.log(json))
            ```
        */

      // 1. 조회
      function getData(url) {
        fetch(`http://localhost:3000/` + url)
          .then((response) => response.json())
          .then((json) => console.log(json));
      }

      // 2. 생성
      function postData(url) {
        const data = { title: "2학년 1반", views: 10000 };
        fetch(`http://localhost:3000/` + url, {
          method: "POST",
          body: JSON.stringify(data), // 생성할 데이터를 JSON 문자열로 변환
          header: { "content-type": "application/json:charset=utf-8" },
        })
          .then((response) => response.json())
          .then((json) => console.log(json));
      }

      // 3. 수정
      function putData(url) {
        const data = { title: "530", views: 530 };
        fetch(`http://localhost:3000/` + url + "/1", {
          method: "PUT",
          body: JSON.stringify(data), // 생성할 데이터를 JSON 문자열로 변환
          header: { "content-type": "application/json:charset=utf-8" },
        })
          .then((response) => response.json())
          .then((json) => console.log(json));
      }

      // 4. 삭제
      function delData(url) {
        fetch(`http://localhost:3000/` + url + "/rQLydkJailc", {
          method: "DELETE",
        })
          .then((response) => response.json())
          .then((json) => console.log(json));
      }

      document
        .getElementById("get_btn")
        .addEventListener("click", () => getData("posts"));

      document
        .getElementById("post_btn")
        .addEventListener("click", () => postData("posts"));

      document
        .getElementById("put_btn")
        .addEventListener("click", () => putData("posts"));

      document
        .getElementById("del_btn")
        .addEventListener("click", () => delData("posts"));
    </script>
  </body>
</html>
