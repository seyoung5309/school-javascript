<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts 데이터 관리</title>
    <link rel="stylesheet" href="./css/35_2_winter.css" />
    <script src="./js/35_2_winterAlert.js"></script>
  </head>
  <body>
    <main class="winter-card">
      <div>
        <h1>Posts 데이터 관리</h1>
      </div>
      <div>
        <input type="text" name="" id="id" placeholder="id" />
        <input type="text" name="" id="title" placeholder="title" />
        <input type="text" name="" id="view" placeholder="view" />
      </div>
      <div>
        <button id="getData" onclick="getData()">조회</button>
        <button id="postData" onclick="postData(`posts`)">추가</button>
        <button id="updateData" onclick="putData(`posts`)">수정</button>
        <button id="deleteData" onclick="deleteData(`posts`)">삭제</button>
      </div>
      <div id="postList">
        <h2>목록 결과</h2>
        <table id="dataTable"></table>
      </div>
    </main>
    <script>
      const url = "http://localhost:3000/";

      /*
        1. getData(): 전체 목록 조회
        2. postData(): id는 상관없이, 나머지는 유효성 확인
        3. updateData(): id(o, x) 나머지는 즉시 반영 및 유효성
        4. deleteData(): id를 가지고 삭제
        5. rendering(): 화면에 뿌리기
        6. clear
      */

      // XMLHttpRequest 객체를 이용하여 db를 조회해보기

      function checkData() {
        let id = document.getElementById("id").value;
        let title = document.getElementById("title").value;
        let view = document.getElementById("view").value;

        let newData = {};

        if (!id) {
          newData["message"] = "아이디를 입력해 주세요.";
          return newData;
        }

        if (!title) {
          newData["message"] = "타이틀을 추가해 주세요.";
          return newData;
        }
        if (!view) {
          newData["message"] = "조회수를 추가해 주세요.";
          return newData;
        }

        newData["status"] = 1;
        newData["message"] = "success";
        newData["id"] = id;
        newData["title"] = title;
        newData["views"] = view;

        return newData;
      }

      function getData() {
        const xhr = new XMLHttpRequest();

        xhr.open("GET", "http://localhost:3000/posts");
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send();

        xhr.onload = () => {
          if (xhr.status == 200) {
            const result = JSON.parse(xhr.response);
            rendering(result);
          } else {
            console.log("error");
            console.log(xhr.status, xhr.statusText);
          }
        };
      }

      // 1. 생성
      const postData = (target) => {
        const xhr = new XMLHttpRequest();

        let check = checkData();
        if (!check.status) {
          alert(check.message);
          return;
        }

        xhr.open("POST", url + target);
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send(JSON.stringify(check));

        xhr.onload = () => {
          if (xhr.status == 201) {
            const result = JSON.parse(xhr.response);
            getData();
          } else {
            console.log(result + "error");
            console.log(xhr.status, xhr.statusText);
          }
        };
      };

      // 2. 수정
      let putData = (target) => {
        const xhr = new XMLHttpRequest();

        let check = checkData();
        if (!check.status) {
          alert(check.message);
          return;
        }

        xhr.open("PUT", url + target + "/" + check.id);
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send(JSON.stringify(check));

        xhr.onload = () => {
          if (xhr.status == 200) {
            const result = JSON.parse(xhr.response);
            getData();
          } else {
            console.log("error");
            console.log(xhr.status, xhr.statusText);
          }
        };
      };

      // 3. 삭제
      const deleteData = (target) => {
        const xhr = new XMLHttpRequest();

        let id = document.getElementById("id").value;

        if (!id) {
          alert("아이디를 입력해 주세요.");
          return;
        }

        xhr.open("DELETE", url + target + "/" + id);
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send();

        xhr.onload = () => {
          if (xhr.status == 200) {
            const result = JSON.parse(xhr.response);
            getData();
          } else {
            console.log("error");
            console.log(xhr.status, xhr.statusText);
          }
        };
      };

      const rendering = (datas) => {
        let renderData = [
          `<tr><th>ID</th><th>Title</th><th>Views</th></tr>`,
          "<tr>",
        ];
        for (let data of datas) {
          renderData.push(
            `<tr><td>${data.id}</td><td>${data.title}</td><td>${data.views}</td></tr>`,
          );
        }
        let loadData = renderData;
        loadData.push("</tr>");
        document.getElementById("dataTable").innerHTML = loadData.join("");

        document.getElementById("id").value = null;
        document.getElementById("title").value = null;
        document.getElementById("view").value = null;
      };
    </script>
  </body>
</html>
