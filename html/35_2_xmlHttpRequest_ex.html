<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        margin-bottom: 24px;
      }
      input {
        width: 150px;
        height: 30px;
      }
      button {
        width: 150px;
        height: 50px;
      }
      table {
        border: 1px solid black;
      }
      td {
        height: 30px;
        width: 250px;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Posts 데이터 관리</h1>
    </div>
    <div>
      <input type="text" name="" id="id" placeholder="id" />
      <input type="text" name="" id="title" placeholder="title" />
      <input type="text" name="" id="view" placeholder="view" />
    </div>
    <div>
      <button id="getData" onclick="getData()">조회</button>
      <button id="postData" onclick="postData(`posts`)">추가</button>
      <button id="updateData" onclick="updateData(`posts`)">수정</button>
      <button id="deleteData" onclick="deleteData(`posts`)">삭제</button>
    </div>
    <div id="postList">
      <h2>목록 결과</h2>
      <table id="dataTable"></table>
    </div>
    <script>
      const url = "http://localhost:3000/";

      /*
        1. getData(): 전체 목록 조회
        2. postData(): id는 상관없이, 나머지는 유효성 확인
        3. updateData(): id(o, x) 나머지는 즉시 반영 및 유효성
        4. deleteData(): id를 가지고 삭제
        5. rendering(): 화면에 뿌리기
        6. clear
      */

      // XMLHttpRequest 객체를 이용하여 db를 조회해보기

      function getData() {
        const xhr = new XMLHttpRequest();

        xhr.open("GET", "http://localhost:3000/posts");

        xhr.setRequestHeader("content-type", "application/json");

        xhr.send();

        xhr.onload = () => {
          if (xhr.status == 200) {
            const result = JSON.parse(xhr.response);
            rendering(result);
          } else {
            console.log("error");
            console.log(xhr.status, xhr.statusText);
          }
        };
      }

      // 1. 생성
      const postData = (target) => {
        const xhr = new XMLHttpRequest();

        let id = document.getElementById("id").value;
        let title = document.getElementById("title").value;
        let view = document.getElementById("view").value;
        let newData = { id: id, title: title, views: view };
        let sendData = [];
        sendData.push(newData);

        if (!title) {
          alert("타이틀을 추가해 주세요.");
          return;
        }
        if (!view) {
          alert("조회수를 추가해 주세요.");
          return;
        }

        xhr.open("POST", url + target);
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send(JSON.stringify(newData));

        xhr.onload = () => {
          if (xhr.status == 201) {
            const result = JSON.parse(xhr.response);
            getData();
          } else {
            console.log(result + "error");
            console.log(xhr.status, xhr.statusText);
          }
        };
      };

      // 2. 수정
      let putData = (target, id) => {
        const xhr = new XMLHttpRequest();

        xhr.open("PUT", url + target + "/" + id);
        xhr.setRequestHeader("content-type", "application/json");

        let newData = { id: id, title: title, views: view };

        xhr.send(JSON.stringify(updateData));

        xhr.onload = () => {
          if (xhr.status == 200) {
            const result = JSON.parse(xhr.response);
            rendering(result);
          } else {
            console.log("error");
            console.log(xhr.status, xhr.statusText);
          }
        };
      };

      // 3. 삭제
      const deleteData = (target, id) => {
        const xhr = new XMLHttpRequest();

        xhr.open("DELETE", url + target + "/" + id);
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send();

        xhr.onload = () => {
          if (xhr.status == 200) {
            const result = JSON.parse(xhr.response);
            rendering(result);
          } else {
            console.log("error");
            console.log(xhr.status, xhr.statusText);
          }
        };
      };

      const rendering = (datas) => {
        let renderData = [
          `<tr><th>ID</th><th>Title</th><th>Views</th></tr>`,
          "<tr>",
        ];
        for (let data of datas) {
          renderData.push(
            `<tr><td>${data.id}</td><td>${data.title}</td><td>${data.views}</td></tr>`,
          );
        }
        let loadData = renderData;
        loadData.push("</tr>");
        document.getElementById("dataTable").innerHTML = loadData.join("");

        document.getElementById("id").value = null;
        document.getElementById("title").value = null;
        document.getElementById("view").value = null;
      };
    </script>
  </body>
</html>
