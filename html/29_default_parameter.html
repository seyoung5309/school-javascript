<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const sayHello = (name) => {
        if (name) {
          console.log(`Hello, ${name}`);
        }
      };

      sayHello("하윤");
      sayHello();

      console.log("==========");

      // default parameter
      const sayHello2 = (name = "World") => {
        console.log(`Hello, ${name}`);
      };

      sayHello2("하윤");
      sayHello2();
    </script>
  </body>
</html>
